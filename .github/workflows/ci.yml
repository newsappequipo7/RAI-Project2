name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI (Firestore emulator for rules tests)
        run: npm install --global firebase-tools

      - name: Block leaked Anthropic keys
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "Anthropic API key pattern found in tracked files"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (mock AI only, no provider calls)
        run: pnpm test
        env:
          AI_MODE: mock

      - name: Install Playwright browser
        run: pnpm -F e2e exec playwright install --with-deps chromium

      - name: E2E (editorial flow against Firebase emulators, AI mock, no credits)
        run: pnpm -F e2e run e2e
        env:
          AI_MODE: mock
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

